<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اتصل بنا - رياحين الجنة</title>
<style>
body{background:#fff8f0; font-family:tahoma; margin:0; padding:0; display:flex; flex-direction:column; align-items:center; min-height:100vh;}
.main-box{background:white; border:2px solid #c27ba0; border-radius:20px; padding:25px; width:95%; max-width:500px; box-shadow:0 5px 15px rgba(0,0,0,0.1); text-align:center; margin-top:20px;}
nav{font-size:16px; margin-bottom:15px;} nav a{color:#8b2252; text-decoration:none; margin:0 5px;}
h1{color:#8b2252; font-size:26px;}
label{font-size:17px; color:#444; display:block; text-align:right; margin:15px 5px 5px 0;}
input, textarea{width:100%; font-size:17px; border:1.5px solid #d9a2c0; border-radius:10px; padding:10px 12px; box-sizing:border-box; outline:none;}
input{height:48px;}
button{width:100%; height:50px; font-size:20px; background:#c27ba0; color:white; border:none; border-radius:12px; margin-top:15px;}
</style>
</head>
<body>

<div style="background:#8b2252; color:white; padding:15px; text-align:center; font-size:26px; font-weight:bold; width:100%;">🌸 رياحين الجنة 🌸</div>

<div class="main-box">
<nav>
<a href="#" onclick="logout()">تسجيل خروج</a> |
<a href="home.html">الرئيسية</a> |
<a href="sahabyat.html">الصحابيات</a> |
<a href="askus.html">اتصل بنا</a>
</nav>

<h1>اتصل بنا 💌</h1>
<p style="color:#888;">عندك سؤال أو اقتراح؟ راسلينا</p>

<label>اسمك:</label>
<input type="text" id="name" placeholder="اكتبي اسمك">

<label>رسالتك:</label>
<textarea id="msg" rows="4" placeholder="اكتبي رسالتك هنا..."></textarea>

<button onclick="sendMsg()">ارسال</button>
<p id="done" style="color:green; font-size:18px;"></p>
</div>

<script>
function sendMsg(){
  let n = document.getElementById('name').value;
  let m = document.getElementById('msg').value;

  if(n == "" || m == ""){
    alert("اكتبي اسمك ورسالتك أول 🌸");
    return;
  }

  document.getElementById('done').innerText = "شكراً يا " + n + "، تم ارسال رسالتك 🌸";
  document.getElementById('name').value = "";
  document.getElementById('msg').value = "";
}

function logout(){
  localStorage.removeItem('userName');
  alert('تم تسجيل خروجك 🌸');
  window.location.href = 'index.html';
}
</script>

</body>
</html>
