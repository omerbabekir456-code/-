<html>
<head>
<meta charset="UTF-8">
<title>تسجيل الدخول</title>
</head>
<body dir="rtl">
    <font size="5">
        <h1>تسجيل الدخول</h1>
    </font>
    
    <form>
        <p>
            <font size="4">
                <big>الاسم: </big><br>
                <input type="text" placeholder="الاسم" required size="25">
            </font>
        </p>
        <p>
            <font size="4">
                <big>كلمة المرور: </big><br>
                <input type="password" placeholder="كلمة المرور" required minlength="4" size="25">
            </font>
        </p>
        <p>
            <font size="5">
                <button type="submit"><big>دخول</big></button>
            </font>
        </p>
    </form>
</body>
</html>
