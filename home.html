<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الرئيسية - رياحين الجنة</title>
<style>
body{background:#fff8f0; font-family:tahoma; margin:0; padding:0; display:flex; flex-direction:column; align-items:center; min-height:100vh;}
.main-box{background:white; border:2px solid #c27ba0; border-radius:20px; padding:25px; width:95%; max-width:500px; box-shadow:0 5px 15px rgba(0,0,0,0.1); text-align:center; margin-top:20px;}
nav{font-size:16px; margin-bottom:15px;} nav a{color:#8b2252; text-decoration:none; margin:0 5px;}
h1{color:#8b2252; font-size:26px;}
#welcome{color:#c27ba0; font-size:22px;}
button{width:100%; height:50px; font-size:20px; background:#c27ba0; color:white; border:none; border-radius:12px; margin-top:15px;}
</style>
</head>
<body>

<div style="background:#8b2252; color:white; padding:15px; text-align:center; font-size:26px; font-weight:bold; width:100%;">🌸 رياحين الجنة 🌸</div>

<div class="main-box">
<nav>
<a href="#" onclick="logout()">تسجيل خروج</a> |
<a href="home.html">الرئيسية</a> |
<a href="sahabyat.html">الصحابيات</a> |
<a href="askus.html">اتصل بنا</a>
</nav>

<h2 id="welcome"></h2>

<h1>أهلاً بيك في رياحين الجنة 🌸</h1>
<p>موقع للبنات المسلمات، قدوة وصحبة صالحة</p>

<button onclick="window.location.href='sahabyat.html'">شوفي الصحابيات</button>
<button onclick="window.location.href='askus.html'">اتصل بنا</button>
</div>

<script>
let name = localStorage.getItem('userName');

if(name){
  document.getElementById('welcome').innerText = 'أهلاً بيك يا ' + name + ' 🌸';
} else {
  document.getElementById('welcome').innerText = 'أهلاً بيك 🌸';
}

function logout(){
  localStorage.removeItem('userName');
  alert('تم تسجيل خروجك 🌸');
  window.location.href = 'index.html';
}
</script>

</body>
</html>
